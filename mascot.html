<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALGNYTE | Phoenix Reveal</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --fire:#ff4d00;
  --ember:#ff9b42;
  --dark:#020202;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--dark);
  color:#fff;
  font-family:'Inter',sans-serif;
  overflow:hidden;
}

/* ===== HERO ===== */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h1{
  font-family:'Orbitron',sans-serif;
  font-size:1.4rem;
  letter-spacing:4px;
  color:var(--ember);
  animation:flicker 2s infinite alternate;
}

@keyframes flicker{
  from{opacity:.4}
  to{opacity:1}
}

.hero button{
  margin-top:40px;
  padding:16px 44px;
  font-family:'Orbitron',sans-serif;
  font-size:1rem;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:linear-gradient(45deg,var(--fire),var(--ember));
  color:#000;
  box-shadow:0 0 35px var(--fire);
  transition:.3s;
}

.hero button:hover{
  transform:scale(1.1);
}

/* ===== REVEAL ===== */
.reveal{
  position:relative;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* FIRE VIDEO */
.reveal video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.6;
  z-index:0;
}

/* DARK OVERLAY */
.reveal::after{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle,rgba(0,0,0,.25),#000 70%);
  z-index:1;
}

/* PHOENIX IMAGE */
.phoenix{
  width:360px;
  z-index:2;
  opacity:0;
  animation:phoenixReveal 2.2s forwards;
  animation-delay:.6s;
}

@keyframes phoenixReveal{
  from{
    opacity:0;
    transform:scale(.92);
  }
  to{
    opacity:1;
    transform:scale(1);
    filter:
      drop-shadow(0 0 40px var(--fire))
      drop-shadow(0 0 90px var(--ember));
  }
}

/* NAME */
.name{
  margin-top:30px;
  font-family:'Orbitron',sans-serif;
  font-size:3.5rem;
  letter-spacing:10px;
  color:var(--fire);
  opacity:0;
  z-index:2;
  animation:fadeIn 1s forwards;
  animation-delay:2.4s;
}

/* TAGLINE */
.tagline{
  margin-top:20px;
  font-size:1.1rem;
  color:#ccc;
  opacity:0;
  z-index:2;
  animation:fadeIn 1s forwards;
  animation-delay:3.2s;
}

@keyframes fadeIn{
  to{opacity:1}
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero" id="home">
  <div>
    <h1>From the ashes, innovation rises.</h1>
    <button onclick="startReveal()">Reveal the Phoenix</button>
  </div>
</section>

<!-- REVEAL -->
<section class="reveal" id="reveal" style="display:none;">
  <video autoplay muted loop playsinline>
    <source src="assets/fire.mp4" type="video/mp4">
  </video>

  <img src="assets/phoenix.jpeg" class="phoenix" alt="ALGNYTE Phoenix">
  <div class="name">ALGNYTE</div>
  <div class="tagline">Tempered for Excellence</div>
</section>

<script>
function startReveal(){
  document.getElementById('home').style.display='none';
  document.getElementById('reveal').style.display='flex';
}
</script>

</body>
</html>
